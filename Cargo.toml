[workspace]
members = ["lib/api", "lib/cloud-ui", "lib/persistence", "lib/cloud", "lib/service", "lib/storage", "lib/plugin-manager", "lib/wasi-plugin", "lib/wasi-web"]
resolver = "2"
exclude = ["test-wasi-plugin", "demo-wasi-plugin", "demo-wasi-web"]
[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
[workspace.dependencies]
actix-cors = "0.7.2"
actix-web = "4.18.1"
actix-web-httpauth = "0.8.3"
actix-web-static-files = { version = "4.1.1", features = ["static-files-03"] }
aes-gcm = "0.10.3"
anyhow = "1.0.104"
async-recursion = "1.2.0"
async-ssh2-lite = { version = "0.5.0", features = ["tokio", "async-io"] }
async-trait = { version = "0.1.92" }
base64 = "0.22.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
ctrlc = "3.5.2"
dav-server = { version = "0.11.0", features = ["actix-compat"] }
dotenvy_macro = "0.15.7"
dotenvy = "0.15.7"
#fastdate = "0.3.33"
fuser = { version = "0.18.0" }
futures = "0.3.34"
futures-util = { version = "0.3.34" }
libc = "0.2.191"
libloading = "0.9.0"
log = "0.4.34"
log4rs = "1.4.0"
mime = "0.3.17"
nfsserve = "0.11.0"
once_cell = "1.21.4"
#openssh = { version = "0.10.4", features = ["native-mux"] }
#openssh-sftp-client = { version = "0.14.3", features = ["openssh"] }
#openssl = { version = "0.10.64" }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "derive", "chrono", "macros"] }
sqlx-sqlite = { version = "0.9.0", features = ["chrono"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "multipart", "json"] }
reqwest-middleware = "0.5.2"
http = "1.5.0"
rust-crypto = "0.2.36"
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
serde_yml = "0.0.13"
sha2 = "0.10.9"
static-files = "0.3.1"
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "rt", "macros"] }
tokio-cron-scheduler = "0.15.1"
urlencoding = "2.1.3"
vcpkg = "0.2.15"
wasmtime = { version = "50.0.0", features = ["cranelift"] }
wasmtime-wasi = "50.0.0"

[gitflow]
production_branch = "main"
development_branch = "develop"
feature_branch_prefix = "feature/"
hotfix_branch_prefix = "hotfix/"
version_tag_prefix = "v"
origin = "origin"